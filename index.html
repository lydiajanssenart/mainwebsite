  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    /* Fullscreen slideshow */
    .slideshow {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    @keyframes kenburns-1 {
      from { transform: scale(1.0) translate(2.5%, 1.5%); }
      to   { transform: scale(1.08) translate(-2%, -1.5%); }
    }
    @keyframes kenburns-2 {
      from { transform: scale(1.08) translate(-2%, -1%); }
      to   { transform: scale(1.0) translate(1.5%, 1.5%); }
    }
    @keyframes kenburns-3 {
      from { transform: scale(1.0) translate(0%, 2.5%); }
      to   { transform: scale(1.08) translate(2%, -1.5%); }
    }
    @keyframes kenburns-4 {
      from { transform: scale(1.08) translate(1.5%, -1.5%); }
      to   { transform: scale(1.0) translate(-2%, 1.5%); }
    }

    .slide {
      position: absolute;
      inset: 0;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      opacity: 0;
      transition: opacity 1.4s ease-in-out;
    }

    .slide.active {
      opacity: 1;
    }

    /* Subtle dark overlay so nav text is readable */
    .slideshow::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.28) 0%,
        rgba(0,0,0,0.05) 40%,
        rgba(0,0,0,0.05) 70%,
        rgba(0,0,0,0.22) 100%
      );
      pointer-events: none;
    }

    /* Header over the slideshow */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 40px;
      background: none;
      border: none;
    }

    header nav a {
      font-family: var(--nav-font, 'Helvetica Neue', Arial, sans-serif);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.85);
      text-decoration: none;
      margin: 0 14px;
      transition: color 0.2s;
    }

    header nav a:hover { color: #fff; }

    .site-name {
      font-family: var(--nav-font, 'Helvetica Neue', Arial, sans-serif);
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #fff;
      text-decoration: none;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    /* Painting caption bottom-left */
    .slide-caption {
      position: fixed;
      bottom: 32px;
      left: 40px;
      z-index: 10;
      color: rgba(255,255,255,0.6);
      font-family: var(--nav-font, 'Helvetica Neue', Arial, sans-serif);
      font-size: 11px;
      letter-spacing: 0.08em;
      transition: opacity 0.6s;
    }

  <script>
    const slideshow = document.getElementById('slideshow');
    const slideEls = Array.from(document.querySelectorAll('.slide'));
    const anims = ['kenburns-1','kenburns-2','kenburns-3','kenburns-4'];

    // Shuffle slides so each page load starts differently
    for (let i = slideEls.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      slideshow.appendChild(slideEls[j]);
      [slideEls[i], slideEls[j]] = [slideEls[j], slideEls[i]];
    }

    const slides = document.querySelectorAll('.slide');
    let current = 0;

    function activate(index) {
      const slide = slides[index];
      slide.style.animation = 'none';
      slide.offsetHeight;
      slide.style.animation = `${anims[index % 4]} 5s ease-in-out forwards`;
      slide.classList.add('active');
    }

    function deactivate(index) {
      const slide = slides[index];
      slide.classList.remove('active');
      // Wait for the opacity fade-out to finish before resetting the
      // animation, so the image doesn't visibly snap back into position
      // while it's still partially visible.
      setTimeout(() => {
        slide.style.animation = 'none';
      }, 1400);
    }

    activate(0);

    setInterval(() => {
      deactivate(current);
      current = (current + 1) % slides.length;
      activate(current);
    }, 4200);
  </script>
